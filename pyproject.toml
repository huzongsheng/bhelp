[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhelp-cli"
version = "0.2.0"
description = "Bilingual Linux command help powered by configurable LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/huzongshen/bhelp"
Repository = "https://github.com/huzongshen/bhelp.git"
Issues = "https://github.com/huzongshen/bhelp/issues"

[project.scripts]
bhelp = "bhelp.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
