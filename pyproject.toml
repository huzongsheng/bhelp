[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bhelp-cli"
version = "0.1.0"
description = "Bilingual Linux command help powered by configurable LLM APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bhelp = "bhelp.cli:entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
