name: Tests and zipapp

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test, build, and smoke test
        run: make check
      - name: Verify standalone installation
        run: |
          BHELP_INSTALL_DIR="$RUNNER_TEMP/bhelp-bin" sh scripts/install.sh
          "$RUNNER_TEMP/bhelp-bin/bhelp" --help
